
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/Dashboard.css">
    <title>IrrigaSense</title>
</head>

<body>

    <nav class="navbar">

         <a href="#" class="logo">
            <img src="img/rem-removebg-preview.png" alt="Logo">
        </a>

        <a href="Dashboard.html" class="item">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </a>

        <a href="configuraçao.html" class="item">
            <i class="fa-solid fa-gear"></i>
            <span>Configuração</span>
        </a>

        <a href="alerta.html" class="item">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span>Alerta</span>
        </a>

    </nav>
    <div class="container">

    <div class="quadrado1">
        <i class="bi bi-water"></i>
     <h2 class="vazao1">Bomba</h2>


            <div class="linha">
                <label class="botao" for="bombaSwitch" aria-label="Ligar ou desligar a bomba">
                        <input id="bombaSwitch" type="checkbox" role="switch" disabled>
                        <span class="circulo" aria-hidden="true"></span>
                        <span id="textoBomba" aria-hidden="true">OFF</span>
                </label>
                <button id="btnConectar" class="botao-conectar" type="button">Conectar</button>
        </div>
        <p id="statusSerial" class="status-serial" role="status" aria-live="polite"></p>
    </div>

     <div class="quadrado2">
        <i class="bi bi-droplet"></i>
        <h2 class="vazao2">Vazao Atual</h2>

    <div class="controle">
        <div class="medidor">
    <h1>0.0 L/min</h1>

    <div class="barra">
        <div class="progresso"></div>
    </div>
    </div>
</div>

    </div>

       <div class="quadrado2">
        <i class="bi bi-droplet"></i>
        <h2 class="vazao2">Vazao media</h2>

    <div class="controle">
        <div class="medidor">
    <h1>0.0 L/min</h1>

    <div class="barra">
        <div class="progresso"></div>
    </div>
    </div>
</div>

    </div>
      
       <div class="quadrado2">
        <i class="bi bi-droplet"></i>
        <h2 class="vazao2">Volume Usado</h2>

    <div class="controle">
        <div class="medidor">
    <h1>0.0 L/min</h1>
    <div class="barra">
        <div class="progresso"></div>
    </div>
    </div>
</div>

    </div>
       
       </div>

      
<section class="chart-panel card" aria-labelledby="flow-history-title">
    <div class="section-heading chart-header">
        <div>
            <h2 id="flow-history-title">Histórico da vazão</h2>
        </div>
        <span class="chart-unit">L/min</span>
    </div>
    <div class="chart-wrap">
        <canvas id="graficoVazao" width="900" height="260" role="img" aria-label="Gráfico do histórico de vazão"></canvas>
    </div>
</section>
    <script src="../js/script.js"></script>

</body>
</html>
